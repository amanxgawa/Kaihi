# Debian's sshd_config includes this directory first, and the first value wins.
# The wizard logs in as root; the password is set by `mock-vps.sh up`, never baked into the image.
PermitRootLogin yes
PasswordAuthentication yes
KbdInteractiveAuthentication no

# On a volume, so the host key (and the fingerprint the app pins) survives container recreation.
HostKey /var/lib/mock-vps/hostkeys/ssh_host_ed25519_key
HostKey /var/lib/mock-vps/hostkeys/ssh_host_rsa_key
