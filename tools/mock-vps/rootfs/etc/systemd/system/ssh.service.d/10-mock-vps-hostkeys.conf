# The stock unit validates its config (`sshd -t`) before starting, and that fails while the HostKey
# files named in sshd_config.d/10-mock-vps.conf do not exist yet. The empty assignment clears the
# stock ExecStartPre list, so the key generation can run first and the check is put back after it.
[Service]
ExecStartPre=
ExecStartPre=/usr/local/sbin/mock-vps-hostkeys
ExecStartPre=/usr/sbin/sshd -t
